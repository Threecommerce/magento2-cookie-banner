# Creates the GitHub release when the sync pushes a version tag.
# Release notes come from the matching section of CHANGELOG.md.
name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[?v?" v "\\]?( |$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          else
            : > notes.md
          fi
          [ -s notes.md ] || echo "Release $version" > notes.md

      - name: Create or update release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
